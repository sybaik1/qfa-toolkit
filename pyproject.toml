[build-system]
requires = ["setuptools"]

[project]
name = "qfa-toolkit"
authors = [
  {name = "SeungYeop Baik", email = "sybaik2006@gmail.com"},
  {name = "Sicheol Sung", email = "sicheol.sung@yonsei.ac.kr"},
  {name = "Sungmin Kim", email = "rena_rio@yonsei.ac.kr"},
]
dependencies = [
  "numpy>=2.0.0",
  "scipy>=1.14.0",
  "qiskit>=2.0.0",
  "qiskit-ibm-runtime>=0.30.0",
  "qiskit-aer>=0.15.0",
]
requires-python = ">=3.10"
optional-dependencies.dev = [
  "mypy>=1.15.0",
  "jupyter>=1.1.0",
  "jupytext>=1.16.0",
  "matplotlib>=3.9.0",
]
version = "0.0.1"

# mypy global options:

[tool.mypy]
python_version = "3.10"
mypy_path = "src"
# warn_return_any = true
# warn_unused_configs = true
# plugins = "numpy.typing.mypy_plugin"
